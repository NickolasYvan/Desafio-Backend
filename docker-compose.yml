# Sobe tudo:                    docker compose up --build
# So a infraestrutura (dev):    docker compose up -d postgres elasticsearch   (e rode a app pela IDE/Maven)
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/solicitacoes
      DB_USER: solicitacoes
      DB_PASSWORD: solicitacoes
      ELASTIC_URL: http://elasticsearch:9200
      # Valores de desenvolvimento. Em producao, defina JWT_SECRET (32+ caracteres) e ADMIN_PASSWORD de verdade.
      JWT_SECRET: ${JWT_SECRET:-chave-de-desenvolvimento-com-mais-de-32-caracteres}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sea.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: solicitacoes
      POSTGRES_USER: solicitacoes
      POSTGRES_PASSWORD: solicitacoes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solicitacoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  esdata:
