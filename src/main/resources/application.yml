spring:
  application:
    name: solicitacoes
  data:
    web:
      pageable:
        max-page-size: 100   # limita ?size= nas listagens paginadas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solicitacoes}
    username: ${DB_USER:solicitacoes}
    password: ${DB_PASSWORD:solicitacoes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema e criado pelo Flyway; o Hibernate so confere
  flyway:
    enabled: true
  elasticsearch:
    uris: ${ELASTIC_URL:http://localhost:9200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-por-uma-com-pelo-menos-32-caracteres}
    expiration-minutes: 60
  admin:
    # Administrador criado na primeira execucao (somente se nao existir nenhum ADMIN).
    email: ${ADMIN_EMAIL:admin@sea.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
  viacep:
    base-url: https://viacep.com.br/ws
