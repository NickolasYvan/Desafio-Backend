spring:
  datasource:
    # H2 imitando o PostgreSQL: as mesmas migrations do Flyway rodam no teste.
    # INIT ensina ao H2 o tipo TIMESTAMPTZ do PostgreSQL, para a migration original rodar sem alteracao.
    url: jdbc:h2:mem:solicitacoes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  elasticsearch:
    uris: http://localhost:9200   # nao e usado: o indexador e mockado no teste

